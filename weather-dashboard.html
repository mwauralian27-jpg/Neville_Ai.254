<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Weather Dashboard</title>
    <style>
        /* ========================================
           ADVANCED WEATHER DASHBOARD
           Real-time Weather Data & Animations
           ======================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e3c72;
            --primary-light: #2a5298;
            --secondary: #00d4ff;
            --accent: #ff6b6b;
            --success: #51cf66;
            --warning: #ffd93d;
            
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --text-light: #999;
            --text-inverse: #ffffff;
            
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #f0f2f5;
            
            --border: #e0e0e0;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* ========================================
           CONTAINER & LAYOUT
           ======================================== */

        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 2rem;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        }

        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            opacity: 0.2;
            filter: blur(100px);
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            top: -100px;
            left: -100px;
            animation: float 20s ease-in-out infinite;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            bottom: -50px;
            right: -50px;
            animation: float 25s ease-in-out infinite reverse;
        }

        /* ========================================
           HEADER
           ======================================== */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            animation: slideInDown 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            letter-spacing: -1px;
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-box {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid transparent;
            border-radius: 30px;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
            min-width: 250px;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
        }

        .btn-search {
            background: linear-gradient(135deg, var(--secondary), #0099cc);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
            margin-left: -50px;
        }

        .btn-search:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.4);
        }

        .btn-search:active {
            transform: scale(0.95);
        }

        .btn-refresh {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        .btn-refresh:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(180deg);
        }

        /* ========================================
           MAIN CONTENT
           ======================================== */

        .content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        /* ========================================
           CURRENT WEATHER CARD
           ======================================== */

        .current-weather {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 3rem;
            box-shadow: var(--shadow-lg);
            animation: slideInUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
        }

        .location-info h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .location-info p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .weather-icon {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--secondary), #0099cc);
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        .weather-icon svg {
            width: 70%;
            height: 70%;
            fill: white;
        }

        .temperature {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .temp-value {
            font-size: 4rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
        }

        .temp-unit {
            font-size: 1.5rem;
            color: var(--text-secondary);
        }

        .weather-condition {
            font-size: 1.3rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            text-transform: capitalize;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .detail-item {
            background: var(--bg-secondary);
            padding: 1.5rem;
            border-radius: 15px;
            border-left: 4px solid var(--secondary);
            transition: all 0.3s ease;
        }

        .detail-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.2);
        }

        .detail-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .detail-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
        }

        /* ========================================
           HOURLY FORECAST
           ======================================== */

        .forecast-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            animation: slideInUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
        }

        .forecast-section h3 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .hourly-forecast {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 1rem;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .hourly-forecast::-webkit-scrollbar {
            width: 6px;
        }

        .hourly-forecast::-webkit-scrollbar-track {
            background: transparent;
        }

        .hourly-forecast::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 3px;
        }

        .hourly-item {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            padding: 1.25rem;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .hourly-item:hover {
            border-color: var(--secondary);
            transform: translateY(-5px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.2);
        }

        .hour {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .hourly-icon {
            font-size: 2rem;
            margin-bottom: 0.75rem;
        }

        .hourly-temp {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
        }

        /* ========================================
           WEEKLY FORECAST
           ======================================== */

        .weekly-forecast {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            animation: slideInUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
        }

        .weekly-forecast h3 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .forecast-items {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .forecast-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            border-radius: 15px;
            border-left: 4px solid var(--secondary);
            transition: all 0.3s ease;
        }

        .forecast-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.2);
        }

        .forecast-day {
            font-weight: 600;
            color: var(--primary);
            min-width: 100px;
        }

        .forecast-condition {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            justify-content: center;
        }

        .forecast-condition-icon {
            font-size: 1.5rem;
        }

        .forecast-condition-text {
            color: var(--text-secondary);
            text-transform: capitalize;
        }

        .forecast-temp-range {
            display: flex;
            gap: 2rem;
            min-width: 150px;
            justify-content: flex-end;
        }

        .temp-max {
            font-weight: 600;
            color: var(--primary);
        }

        .temp-min {
            color: var(--text-secondary);
        }

        /* ========================================
           ALERTS & NOTIFICATIONS
           ======================================== */

        .alert {
            background: linear-gradient(135deg, var(--accent), #ff4757);
            color: white;
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-md);
            animation: slideInDown 0.4s ease-out;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .alert-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .alert-content h4 {
            margin-bottom: 0.5rem;
        }

        .alert-content p {
            font-size: 0.95rem;
            opacity: 0.95;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 3rem;
            color: white;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Error State */
        .error {
            background: var(--accent);
            color: white;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            animation: shake 0.5s ease-out;
        }

        .error h3 {
            margin-bottom: 1rem;
        }

        /* ========================================
           KEYFRAME ANIMATIONS
           ======================================== */

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-10px);
            }
            75% {
                transform: translateX(10px);
            }
        }

        /* ========================================
           RESPONSIVE DESIGN
           ======================================== */

        @media (max-width: 1200px) {
            .content {
                grid-template-columns: 1fr;
            }

            .current-weather {
                grid-column: 1;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .header-controls {
                width: 100%;
                flex-direction: column;
            }

            .search-box {
                width: 100%;
                min-width: unset;
            }

            .current-weather,
            .forecast-section,
            .weekly-forecast {
                padding: 1.5rem;
            }

            .temp-value {
                font-size: 2.5rem;
            }

            .weather-details {
                grid-template-columns: 1fr;
            }

            .forecast-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .forecast-temp-range {
                justify-content: flex-start;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0.75rem;
            }

            .current-weather {
                padding: 1.5rem;
            }

            .header h1 {
                font-size: 1.25rem;
            }

            .weather-icon {
                width: 80px;
                height: 80px;
            }

            .temp-value {
                font-size: 2rem;
            }

            .weather-details {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .detail-item {
                padding: 1rem;
            }

            .hourly-forecast {
                grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <div class="header-controls">
                <input 
                    type="text" 
                    class="search-box" 
                    id="searchBox" 
                    placeholder="Search city..."
                    autocomplete="off"
                >
                <button class="btn-search" id="btnSearch">🔍</button>
                <button class="btn-refresh" id="btnRefresh" title="Refresh">↻</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content" id="content">
            <!-- Current Weather will be displayed here -->
        </div>
    </div>

    <script>
        // ========================================
        // CONFIGURATION
        // ========================================

        const API_KEY = 'f3c1427c1a1b8c5e8d9f0a1b2c3d4e5f'; // Using free API key
        const BASE_URL = 'https://api.openweathermap.org/data/2.5';
        
        // Fallback to Open-Meteo (free weather API - no key needed)
        const OPEN_METEO_URL = 'https://api.open-meteo.com/v1/forecast';
        const GEO_URL = 'https://geocoding-api.open-meteo.com/v1/search';

        // ========================================
        // DOM ELEMENTS
        // ========================================

        const searchBox = document.getElementById('searchBox');
        const btnSearch = document.getElementById('btnSearch');
        const btnRefresh = document.getElementById('btnRefresh');
        const content = document.getElementById('content');

        // ========================================
        // STATE
        // ========================================

        let currentCity = 'London';
        let currentLat = 51.5074;
        let currentLon = -0.1278;

        // ========================================
        // INITIALIZATION
        // ========================================

        document.addEventListener('DOMContentLoaded', () => {
            initializeWeatherDashboard();
        });

        function initializeWeatherDashboard() {
            // Get user's location or use default
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentLat = position.coords.latitude;
                        currentLon = position.coords.longitude;
                        fetchWeatherData();
                        getReverseGeolocation(currentLat, currentLon);
                    },
                    () => {
                        fetchWeatherData();
                    }
                );
            } else {
                fetchWeatherData();
            }
        }

        // ========================================
        // EVENT LISTENERS
        // ========================================

        btnSearch.addEventListener('click', () => {
            const city = searchBox.value.trim();
            if (city) {
                searchCity(city);
                searchBox.value = '';
            }
        });

        searchBox.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btnSearch.click();
            }
        });

        btnRefresh.addEventListener('click', () => {
            fetchWeatherData();
        });

        // ========================================
        // GEOLOCATION
        // ========================================

        async function searchCity(cityName) {
            try {
                content.innerHTML = '<div class="loading"><div class="spinner"></div><span>Searching...</span></div>';
                
                const response = await fetch(`${GEO_URL}?name=${cityName}&count=1&language=en&format=json`);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    const result = data.results[0];
                    currentLat = result.latitude;
                    currentLon = result.longitude;
                    currentCity = `${result.name}, ${result.country}`;
                    
                    fetchWeatherData();
                } else {
                    showError('City not found');
                }
            } catch (error) {
                console.error('Search error:', error);
                showError('Error searching city');
            }
        }

        async function getReverseGeolocation(lat, lon) {
            try {
                const response = await fetch(`${GEO_URL}?latitude=${lat}&longitude=${lon}&format=json`);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    const result = data.results[0];
                    currentCity = `${result.name}, ${result.country}`;
                }
            } catch (error) {
                console.error('Reverse geocoding error:', error);
            }
        }

        // ========================================
        // FETCH WEATHER DATA (Using Open-Meteo - Free API)
        // ========================================

        async function fetchWeatherData() {
            try {
                content.innerHTML = '<div class="loading"><div class="spinner"></div><span>Loading weather data...</span></div>';

                // Fetch current weather and forecast using Open-Meteo
                const weatherUrl = `${OPEN_METEO_URL}?latitude=${currentLat}&longitude=${currentLon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,relative_humidity_2m_max&temperature_unit=celsius&wind_speed_unit=kmh&precipitation_unit=mm&timezone=auto`;

                const response = await fetch(weatherUrl);
                const data = await response.json();

                displayWeatherDashboard(data);
            } catch (error) {
                console.error('Error fetching weather:', error);
                showError('Failed to fetch weather data. Please try again.');
            }
        }

        // ========================================
        // DISPLAY WEATHER DASHBOARD
        // ========================================

        function displayWeatherDashboard(data) {
            const current = data.current;
            const hourly = data.hourly;
            const daily = data.daily;

            const currentTime = new Date();
            const weatherDescription = getWeatherDescription(current.weather_code);
            const weatherIcon = getWeatherIcon(current.weather_code);

            content.innerHTML = `
                <!-- Current Weather Card -->
                <div class="current-weather">
                    <div class="weather-header">
                        <div class="location-info">
                            <h2>${currentCity}</h2>
                            <p>${currentTime.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</p>
                        </div>
                        <div class="weather-icon">${weatherIcon}</div>
                    </div>

                    <div class="temperature">
                        <span class="temp-value">${Math.round(current.temperature_2m)}</span>
                        <span class="temp-unit">°C</span>
                    </div>

                    <div class="weather-condition">${weatherDescription}</div>
                    <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Feels like ${Math.round(current.apparent_temperature)}°C</p>

                    <div class="weather-details">
                        <div class="detail-item">
                            <div class="detail-label">💧 Humidity</div>
                            <div class="detail-value">${current.relative_humidity_2m}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">💨 Wind Speed</div>
                            <div class="detail-value">${Math.round(current.wind_speed_10m)} km/h</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">🧭 Wind Direction</div>
                            <div class="detail-value">${getWindDirection(current.wind_direction_10m)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">🌧️ Precipitation</div>
                            <div class="detail-value">${current.precipitation}mm</div>
                        </div>
                    </div>
                </div>

                <!-- Hourly Forecast -->
                <div class="forecast-section">
                    <h3>⏰ Hourly Forecast</h3>
                    <div class="hourly-forecast">
                        ${generateHourlyForecast(hourly, currentTime)}
                    </div>
                </div>

                <!-- Weekly Forecast -->
                <div class="weekly-forecast">
                    <h3>📅 7-Day Forecast</h3>
                    <div class="forecast-items">
                        ${generateWeeklyForecast(daily)}
                    </div>
                </div>
            `;
        }

        // ========================================
        // GENERATE HOURLY FORECAST
        // ========================================

        function generateHourlyForecast(hourly, currentTime) {
            let html = '';
            const currentHour = currentTime.getHours();

            for (let i = 0; i < 24; i++) {
                const forecastTime = new Date(currentTime);
                forecastTime.setHours(currentTime.getHours() + i);
                
                const hour = forecastTime.getHours();
                const temp = Math.round(hourly.temperature_2m[i]);
                const precipitation = hourly.precipitation_probability[i];
                const weatherCode = hourly.weather_code[i];
                const icon = getWeatherIcon(weatherCode);

                html += `
                    <div class="hourly-item">
                        <div class="hour">${String(hour).padStart(2, '0')}:00</div>
                        <div class="hourly-icon">${icon}</div>
                        <div class="hourly-temp">${temp}°C</div>
                        <div style="font-size: 0.75rem; color: var(--text-secondary);">${precipitation}%</div>
                    </div>
                `;
            }

            return html;
        }

        // ========================================
        // GENERATE WEEKLY FORECAST
        // ========================================

        function generateWeeklyForecast(daily) {
            let html = '';
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

            for (let i = 0; i < 7; i++) {
                const date = new Date();
                date.setDate(date.getDate() + i);
                
                const dayName = days[date.getDay()];
                const maxTemp = Math.round(daily.temperature_2m_max[i]);
                const minTemp = Math.round(daily.temperature_2m_min[i]);
                const weatherCode = daily.weather_code[i];
                const description = getWeatherDescription(weatherCode);
                const icon = getWeatherIcon(weatherCode);
                const precipitation = daily.precipitation_sum[i];

                html += `
                    <div class="forecast-item">
                        <div class="forecast-day">${dayName}</div>
                        <div class="forecast-condition">
                            <span class="forecast-condition-icon">${icon}</span>
                            <span class="forecast-condition-text">${description}</span>
                        </div>
                        <div class="forecast-temp-range">
                            <span>🌧️ ${precipitation}mm</span>
                            <span style="margin-left: 1rem;">
                                <span class="temp-max">${maxTemp}°</span>
                                <span class="temp-min"> / ${minTemp}°</span>
                            </span>
                        </div>
                    </div>
                `;
            }

            return html;
        }

        // ========================================
        // WEATHER CODE TO DESCRIPTION
        // ========================================

        function getWeatherDescription(weatherCode) {
            const descriptions = {
                0: 'Clear sky',
                1: 'Mainly clear',
                2: 'Partly cloudy',
                3: 'Overcast',
                45: 'Foggy',
                48: 'Depositing rime fog',
                51: 'Light drizzle',
                53: 'Moderate drizzle',
                55: 'Dense drizzle',
                61: 'Slight rain',
                63: 'Moderate rain',
                65: 'Heavy rain',
                71: 'Slight snow',
                73: 'Moderate snow',
                75: 'Heavy snow',
                77: 'Snow grains',
                80: 'Slight rain showers',
                81: 'Moderate rain showers',
                82: 'Violent rain showers',
                85: 'Slight snow showers',
                86: 'Heavy snow showers',
                95: 'Thunderstorm',
                96: 'Thunderstorm with slight hail',
                99: 'Thunderstorm with heavy hail'
            };

            return descriptions[weatherCode] || 'Unknown';
        }

        // ========================================
        // WEATHER CODE TO ICON
        // ========================================

        function getWeatherIcon(weatherCode) {
            if (weatherCode === 0) return '☀️';
            if (weatherCode <= 3) return '🌤️';
            if (weatherCode <= 48) return '🌫️';
            if (weatherCode <= 67) return '🌧️';
            if (weatherCode <= 77) return '❄️';
            if (weatherCode <= 82) return '⛈️';
            if (weatherCode <= 86) return '❄️';
            if (weatherCode >= 95) return '⛈️';
            return '🌈';
        }

        // ========================================
        // WIND DIRECTION
        // ========================================

        function getWindDirection(degrees) {
            const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            const index = Math.round(degrees / 22.5) % 16;
            return directions[index];
        }

        // ========================================
        // ERROR HANDLING
        // ========================================

        function showError(message) {
            content.innerHTML = `
                <div class="error" style="grid-column: 1 / -1;">
                    <h3>⚠️ Error</h3>
                    <p>${message}</p>
                    <button style="
                        margin-top: 1rem;
                        padding: 0.75rem 1.5rem;
                        background: white;
                        color: var(--accent);
                        border: none;
                        border-radius: 8px;
                        cursor: pointer;
                        font-weight: 600;
                        transition: all 0.3s ease;
                    " onclick="location.reload()">
                        Try Again
                    </button>
                </div>
            `;
        }
